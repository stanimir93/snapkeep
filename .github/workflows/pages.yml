# Deploys the download page to GitHub Pages, filled in with the latest release.
# Runs when a release is published, when the page changes on main, or by hand.
name: Pages

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [site/**, docs/icon.png, scripts/build-site.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the page
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build-site.sh _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
